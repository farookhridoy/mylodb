[package]
name = "myq-profile"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
myq-driver = { path = "../myq-driver" }
myq-sql = { path = "../myq-sql" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
