[package]
name = "myq-transfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
myq-core = { path = "../myq-core" }
myq-driver = { path = "../myq-driver" }
myq-sql = { path = "../myq-sql" }
myq-schema = { path = "../myq-schema" }
csv = "1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the columns of a JSON import keep the order the keys first appear in
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
