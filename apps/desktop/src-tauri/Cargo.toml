[package]
name = "mylodb-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
myq-schema = { path = "../../../crates/myq-schema" }
myq-driver = { path = "../../../crates/myq-driver" }
myq-store = { path = "../../../crates/myq-store" }
myq-data = { path = "../../../crates/myq-data" }
myq-admin = { path = "../../../crates/myq-admin" }
myq-sql = { path = "../../../crates/myq-sql" }
myq-profile = { path = "../../../crates/myq-profile" }
myq-tunnel = { path = "../../../crates/myq-tunnel" }
myq-transfer = { path = "../../../crates/myq-transfer" }
tauri-plugin-dialog = "2"
base64 = "0.22"

[lib]
name = "mylodb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
