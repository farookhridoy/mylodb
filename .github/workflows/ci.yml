name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # the website builds: every local link and image exists (it is published by pages.yml)
  site:
    name: Website check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-site.mjs

  # The Rust crates, tested against real servers: the integration tests create their own uniquely named databases and drop them again.
  rust:
    name: Rust · ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MySQL 5.7 is not tested: it is end of life and lacks features the app uses (window functions, EXPLAIN ANALYZE, roles)
        server:
          - { name: "MySQL 8.0", image: "mysql:8.0", env: "MYSQL_ALLOW_EMPTY_PASSWORD=yes" }
          - { name: "MySQL 8.4", image: "mysql:8.4", env: "MYSQL_ALLOW_EMPTY_PASSWORD=yes" }
          - { name: "MySQL 9", image: "mysql:9", env: "MYSQL_ALLOW_EMPTY_PASSWORD=yes" }
          - { name: "MariaDB 10.11", image: "mariadb:10.11", env: "MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1" }
          - { name: "MariaDB 11.4", image: "mariadb:11.4", env: "MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start ${{ matrix.server.name }}
        run: |
          docker run -d --name db -p 3306:3306 -e ${{ matrix.server.env }} ${{ matrix.server.image }}
          for i in $(seq 1 60); do
            # MariaDB 11 images ship `mariadb` / `mariadb-admin` and no longer have the mysql-named clients
            docker exec db sh -c 'if command -v mariadb-admin >/dev/null; then mariadb-admin ping -h127.0.0.1 --silent; else mysqladmin ping -h127.0.0.1 --silent; fi' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec db sh -c 'if command -v mariadb >/dev/null; then C=mariadb; else C=mysql; fi; $C -uroot -h127.0.0.1 -e "SELECT VERSION()"'
      - name: Test the workspace
        # the desktop crate needs GTK and WebKit on Linux; it is built and unit tested on macOS below
        run: cargo test --workspace --exclude mylodb-desktop --no-fail-fast
        env:
          MYLODB_TEST_HOST: 127.0.0.1
          MYLODB_TEST_PORT: "3306"

  # PostgreSQL, on its own server (the MySQL jobs skip these tests: they only run when MYLODB_TEST_PG_PORT is set)
  postgres:
    name: Rust · PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["13", "16", "18"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start PostgreSQL ${{ matrix.version }}
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:${{ matrix.version }}
          for i in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec pg psql -h 127.0.0.1 -U postgres -c "SELECT version()"
      - name: Test the PostgreSQL crate
        run: cargo test -p myq-postgres --no-fail-fast
        env:
          MYLODB_TEST_PG_PORT: "5432"

  # The React app: type check and every UI suite against the fake Tauri bridge in e2e/mock.js.
  ui:
    name: UI suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:e2e-list
      - run: npx playwright-core install --with-deps chromium
      - name: Run the UI suites
        run: |
          npx vite --port 1420 --strictPort &
          for i in $(seq 1 60); do curl -sf http://localhost:1420 >/dev/null && break; sleep 1; done
          npm run e2e

  # The desktop shell also compiles on Windows (the installer is built at release time).
  desktop-windows:
    name: Desktop build check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo check -p mylodb-desktop

  # The desktop shell compiles (menu bar, commands) on macOS.
  desktop:
    name: Desktop build check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo test -p mylodb-desktop --lib
