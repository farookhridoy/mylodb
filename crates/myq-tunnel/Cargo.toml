[package]
name = "myq-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
russh = "0.65"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
myq-driver = { path = "../myq-driver" }
