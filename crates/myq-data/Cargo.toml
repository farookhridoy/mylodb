[package]
name = "myq-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
myq-driver = { path = "../myq-driver" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
